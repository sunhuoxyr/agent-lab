server:
  port: 8080

spring:
  application:
    name: agent-lab-server
  datasource:
    url: jdbc:mysql://localhost:13306/agent_lab?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root123
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none   # 表结构只认 schema.sql，不让 JPA 自己建
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 16379

llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  history-window: 20

rag:
  vault-path: ${VAULT_PATH:/Users/sunhuo/Library/Mobile Documents/iCloud~md~obsidian/Documents/origin}
  embedding-base-url: ${EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  embedding-api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
  embedding-model: ${EMBEDDING_MODEL:embedding-3}
  top-k: 5

ratelimit:
  chat-per-minute: 20

mybatis:
  configuration:
    map-underscore-to-camel-case: true   # created_at → createdAt；不开则时间/外键列全 null
